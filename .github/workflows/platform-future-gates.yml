name: Platform Future Gates

on:
  pull_request:
    branches: [main]

jobs:
  schema-and-registry-gates:
    name: Schema And Registry Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-workspace
      - run: pnpm --filter @ui-construction-library/schema typecheck
      - run: pnpm --filter @ui-construction-library/schema test
      - run: pnpm --filter @ui-construction-library/registry typecheck
      - run: pnpm --filter @ui-construction-library/registry test

  export-smoke-builds:
    name: Export Smoke Builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-workspace
      - run: pnpm --filter @ui-construction-library/tokens build
      - run: pnpm --filter @ui-construction-library/schema build
      - run: pnpm --filter @ui-construction-library/styles build
      - run: pnpm --filter @ui-construction-library/registry build
      - run: pnpm --filter @ui-construction-library/export-core test
      - run: pnpm --filter @ui-construction-library/export-core build

  builder-quality-gates:
    name: Builder Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-workspace
      - name: Build package dependencies
        run: pnpm build --filter='!@ui-app/*'
      - run: pnpm --filter @ui-app/builder build
      - run: pnpm --filter @ui-app/builder test
      - run: pnpm --filter @ui-app/builder typecheck
      - run: pnpm --filter @ui-construction-library/registry build
