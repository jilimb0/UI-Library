name: Platform Future Gates

on:
  pull_request:
    branches: [main]

jobs:
  schema-and-registry-gates:
    name: Schema And Registry Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ui-construction-library/schema typecheck
      - run: pnpm --filter @ui-construction-library/schema test
      - run: pnpm --filter @ui-construction-library/registry typecheck
      - run: pnpm --filter @ui-construction-library/registry test

  export-smoke-placeholder:
    name: Export Smoke Test (Placeholder)
    runs-on: ubuntu-latest
    steps:
      - run: echo "Placeholder for Phase 5 export smoke matrix"

  generated-project-matrix-placeholder:
    name: Generated Project Matrix (Placeholder)
    runs-on: ubuntu-latest
    steps:
      - run: echo "Placeholder for generated React/Next project verification"

  prompt-regression-placeholder:
    name: Prompt Regression (Placeholder)
    runs-on: ubuntu-latest
    steps:
      - run: echo "Placeholder for Phase 6 prompt regression assertions"

  builder-quality-gates:
    name: Builder Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ui-app/builder test
      - run: pnpm --filter @ui-app/builder typecheck
      - run: pnpm check:supabase-schema
