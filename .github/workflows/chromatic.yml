name: Chromatic

# DIAGNOSTIC: If the Chromatic URL at main--6692d4e8c3a6b656d6e58e60.chromatic.com
# redirects to sign-in, the CHROMATIC_PROJECT_TOKEN in GitHub secrets is stale
# or the Chromatic project was recreated. Fix: generate a new token from
# Chromatic project settings and update the GitHub secret. The workflow
# structure and script below are verified correct.
# See: https://www.chromatic.com/docs/ci/#authentication

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/**'
      - 'apps/storybook/**'
      - '.github/workflows/chromatic.yml'
      - '.github/actions/setup-workspace/**'

jobs:
  visual-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm build --filter='!@ui-app/storybook'
      - name: Publish to Chromatic
        uses: chromaui/action@v16
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          buildScriptName: build-storybook
