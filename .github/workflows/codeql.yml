name: CodeQL

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Re-scan when library/app source or this workflow changes.
# After a fix lands on main, GitHub marks matching alerts as "Fixed" automatically.
on:
  push:
    branches: [main]
    paths: &codeql-paths
      - 'packages/**'
      - 'apps/**'
      - 'tools/**'
      - 'scripts/**'
      - 'tests/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/codeql.yml'
  pull_request:
    branches: [main]
    paths: *codeql-paths
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript
      - run: pnpm build
      - uses: github/codeql-action/analyze@v4
