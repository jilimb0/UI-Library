name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'apps/**'
      - 'tools/**'
      - '.github/workflows/codeql.yml'
      - '.github/actions/setup-workspace/**'
  pull_request:
    branches: [main]
    paths:
      - 'packages/**'
      - 'apps/**'
      - 'tools/**'
      - '.github/workflows/codeql.yml'
      - '.github/actions/setup-workspace/**'
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-workspace
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript
      # Build source packages only — exclude storybook to avoid scanning
      # generated vendor bundles (storybook-static) which produce false positives.
      # Generated bundles are also excluded via .codeqlignore.
      - run: pnpm build --filter='!@ui-app/storybook'
      - uses: github/codeql-action/analyze@v4
