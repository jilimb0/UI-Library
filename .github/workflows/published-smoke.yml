name: Published Smoke

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

jobs:
  smoke:
    if: >
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Download publish flag
        uses: actions/download-artifact@v4
        with:
          name: publish-flag
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Check flag exists
        run: test -f flag.txt || (echo "No publish flag — skipping smoke" && exit 0)

      - name: Registry propagation check
        id: registry-check
        run: |
          set -euo pipefail
          mkdir -p artifacts
          FAILED=0
          PASSED=0
          REPORT_FILE="artifacts/smoke-report.md"
          echo "# Published Smoke Report" > "$REPORT_FILE"
          echo "" >> "$REPORT_FILE"
          echo "**Run**: ${{ github.run_id }}" >> "$REPORT_FILE"
          echo "" >> "$REPORT_FILE"
          echo "## Registry check" >> "$REPORT_FILE"
          echo "" >> "$REPORT_FILE"
          echo "| Package | Expected | Published |" >> "$REPORT_FILE"
          echo "|---------|----------|----------|" >> "$REPORT_FILE"

          for PKG_DIR in packages/*/; do
            PKG_JSON="${PKG_DIR}package.json"
            if [ ! -f "$PKG_JSON" ]; then continue; fi
            NAME=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$PKG_JSON','utf8')).name || '')")
            VER=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$PKG_JSON','utf8')).version || '')")
            PRIVATE=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$PKG_JSON','utf8')).private === true)")
            if [ -z "$NAME" ] || [ "$PRIVATE" = "true" ]; then continue; fi
            ATTEMPTS=0
            FOUND=""
            until FOUND=$(npm view "$NAME" version --registry https://registry.npmjs.org 2>/dev/null); do
              ATTEMPTS=$((ATTEMPTS + 1))
              if [ $ATTEMPTS -ge 5 ]; then
                echo "| $NAME | $VER | ❌ Not found |" >> "$REPORT_FILE"
                FAILED=$((FAILED + 1))
                echo "::error::$NAME@$VER not found on registry"
                continue 2
              fi
              sleep 15
            done
            if [ "$FOUND" = "$VER" ]; then
              echo "| $NAME | $VER | ✅ $FOUND |" >> "$REPORT_FILE"
            else
              echo "| $NAME | $VER | ⚠️ $FOUND |" >> "$REPORT_FILE"
            fi
            PASSED=$((PASSED + 1))
          done

          echo "" >> "$REPORT_FILE"
          echo "**Passed**: $PASSED | **Failed**: $FAILED" >> "$REPORT_FILE"
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"

      - name: Install workspace dependencies
        if: steps.registry-check.outputs.failed == '0'
        run: pnpm install --no-frozen-lockfile

      - name: Build export-core and deps
        if: steps.registry-check.outputs.failed == '0'
        run: |
          pnpm --filter @ui-construction-library/tokens build
          pnpm --filter @ui-construction-library/styles build
          pnpm --filter @ui-construction-library/schema build
          pnpm --filter @ui-construction-library/registry build
          pnpm --filter @ui-construction-library/export-core build

      - name: Export smoke check
        id: export-smoke
        if: steps.registry-check.outputs.failed == '0'
        run: |
          RESULT=$(pnpm exec tsx scripts/checks/check-export-smoke.mjs 2>&1 || true)
          echo "$RESULT"
          echo "" >> artifacts/smoke-report.md
          echo "## Export smoke" >> artifacts/smoke-report.md
          echo "" >> artifacts/smoke-report.md
          echo '```' >> artifacts/smoke-report.md
          echo "$RESULT" >> artifacts/smoke-report.md
          echo '```' >> artifacts/smoke-report.md

      - name: Generate HTML dashboard
        run: node scripts/checks/generate-smoke-dashboard.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: published-smoke-dashboard
          path: artifacts/
          retention-days: 30
