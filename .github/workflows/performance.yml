name: Performance

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/performance.yml'
      - '.github/actions/setup-workspace/**'

jobs:
  perf-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-workspace
      - run: pnpm build
      - run: pnpm exec vitest run --config tests/performance/vitest.config.js
      - name: Mutation testing
        continue-on-error: true
        run: pnpm --filter @ui-construction-library/core test:mutation
