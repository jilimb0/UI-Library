name: Performance
on:
  pull_request:
  push:
    branches: [main]

jobs:
  perf-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v6
        with:
          node-version: 18
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec jest tests/performance/bundle-size.test.js --runInBand
      - run: pnpm exec jest tests/performance/memory-leaks.test.js --runInBand
