name: Performance

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/performance.yml'
      - '.github/actions/setup-workspace/**'

jobs:
  perf-checks:
    runs-on: ubuntu-latest
    # Runs after main CI so build artifacts may be cached
    needs: ci
    steps:
      - uses: ./.github/actions/setup-workspace
      - run: pnpm build
      - run: pnpm exec vitest run --config tests/performance/vitest.config.js
