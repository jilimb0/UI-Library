name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/demo-showcase/**'
      - 'apps/docs/**'
      - 'apps/storybook/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'scripts/pages/assemble-pages-site.sh'
      - '.github/workflows/pages.yml'
      - '.github/actions/setup-workspace/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-workspace

      - name: Assemble Pages site
        run: ./scripts/pages/assemble-pages-site.sh
        env:
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./.pages/${{ github.event.repository.name }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
