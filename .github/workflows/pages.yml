name: Pages

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
    paths:
      - 'apps/demo-showcase/**'
      - 'apps/docs/**'
      - 'apps/storybook/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Build Storybook
        run: pnpm build-storybook
        env:
          STORYBOOK_BASE_PATH: /${{ github.event.repository.name }}/storybook/

      - name: Build docs
        run: pnpm --filter @ui-app/docs build
        env:
          DOCS_BASE_PATH: /${{ github.event.repository.name }}/docs/

      - name: Build demo showcase
        run: pnpm --filter @ui-app/demo-showcase build
        env:
          DEMO_BASE_PATH: /${{ github.event.repository.name }}/

      - name: Assemble Pages site
        run: |
          rm -rf ./.pages
          mkdir -p ./.pages/docs ./.pages/storybook
          cp -R ./apps/demo-showcase/dist/. ./.pages/
          cp -R ./apps/docs/dist/. ./.pages/docs/
          cp -R ./apps/storybook/storybook-static/. ./.pages/storybook/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./.pages

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
