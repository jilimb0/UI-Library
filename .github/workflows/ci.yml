name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/**'
      - 'apps/**'
      - 'scripts/**'
      - 'tests/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/ci.yml'
      - 'playwright.config.ts'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:deps
      - run: pnpm check:api
      - run: pnpm registry:source:check
      - run: pnpm preset:check
      - run: pnpm check:gold-kits
      - run: pnpm check:launch
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:security
        continue-on-error: true
      - run: pnpm check:contracts
      - name: Upload contract compliance report
        uses: actions/upload-artifact@v4
        with:
          name: contract-compliance-report
          path: artifacts/contract-compliance.md
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm check:e2e
        env:
          CI: true
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
