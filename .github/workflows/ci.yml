name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/**'
      - 'apps/**'
      - 'scripts/**'
      - 'tests/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
      - '.github/actions/setup-workspace/**'
      - 'playwright.config.ts'
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'apps/**'
      - 'scripts/**'
      - 'tests/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
      - '.github/actions/setup-workspace/**'
      - 'playwright.config.ts'

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v4
        continue-on-error: true
        with:
          fail-on-severity: high
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, CC0-1.0, Unlicense

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-workspace
      - run: pnpm validate:platform
      - run: pnpm check:security
        continue-on-error: true
      - run: pnpm check:contracts
      - run: pnpm check:published --retry
        continue-on-error: true
      - name: Upload contract compliance report
        uses: actions/upload-artifact@v4
        with:
          name: contract-compliance-report
          path: artifacts/contract-compliance.md
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
