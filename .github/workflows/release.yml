name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  release:
    # Run on manual trigger OR after CI passes on main
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    env:
      # Private GitHub repo — npm provenance not supported
      NPM_PUBLISH_PROVENANCE: "false"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for trusted publishing
        run: npm i -g npm@latest

      - run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Verify OIDC context
        run: |
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"
          echo "OIDC context available"

      - name: Drop token auth to force OIDC trusted publishing
        run: |
          rm -f "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}" || true
          rm -f "$HOME/.npmrc" || true

      - name: Create Release PR or Publish
        uses: changesets/action@v1.5.3
        with:
          publish: pnpm -r publish --access public --no-git-checks
          version: pnpm changeset version
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ""
