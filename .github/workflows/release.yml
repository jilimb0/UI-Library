name: Release

env:
  HUSKY: 0
  NPM_PUBLISH_PROVENANCE: "false"

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4

      # registry-url is required — setup-node writes
      # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} into ~/.npmrc
      # which tells npm where the registry is for the OIDC token exchange.
      # NODE_AUTH_TOKEN must NOT be set in the publish step below —
      # setting it to GITHUB_TOKEN causes npm to use it as a bearer token
      # instead of doing the OIDC exchange, resulting in 404.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # Pin npm AFTER setup-node so the OIDC-capable version handles publish.
      - name: Pin npm version
        run: |
          sudo npm i -g npm@11.8.0
          npm -v

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build all packages
        run: pnpm build:ci

      - name: Create Release PR
        uses: changesets/action@v1.5.3
        with:
          version: bash scripts/ci/changeset-version.sh
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish step — runs when no changesets exist (version PR already merged).
      # Checked separately because changesets/action only runs publish on version commits,
      # which prevents retrying after a transient publish failure.
      - name: Publish to npm
        run: |
          if ls .changeset/*.md >/dev/null 2>&1; then
            echo "changesets exist — skipping publish"
          else
            echo "no changesets — publishing unpublished packages"
            node scripts/ci/ci-publish.mjs
          fi

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./
          format: cyclonedx-json
          output-file: ./artifacts/sbom.cyclonedx.json

      - name: Upload publish flag
        if: success()
        run: |
          mkdir -p publish-flag
          echo "published" > publish-flag/flag.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: publish-flag
          path: publish-flag/flag.txt
          retention-days: 1

      - name: Upload release logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-logs-${{ github.run_id }}
          path: |
            /tmp/ci-publish-*.log
          retention-days: 7
          if-no-files-found: ignore
