name: Release

env:
  HUSKY: 0

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4

      # registry-url is REQUIRED — it writes the
      # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} line into ~/.npmrc
      # that npm needs to locate the OIDC token exchange endpoint.
      # With id-token: write + --provenance, npm exchanges the OIDC token
      # automatically — no static NPM_TOKEN needed.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Pin npm version
        run: |
          sudo npm i -g npm@11.8.0
          npm -v

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build all packages
        run: pnpm build:ci

      - name: Check for unpublished packages
        id: check-publish
        run: |
          if ls .changeset/*.md >/dev/null 2>&1; then
            echo "changesets found — skip publish step"
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "no changesets — will publish"
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release PR
        if: steps.check-publish.outputs.has_changesets == 'true'
        uses: changesets/action@v1.5.3
        with:
          version: bash scripts/ci/changeset-version.sh
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        if: steps.check-publish.outputs.has_changesets == 'false'
        run: node scripts/ci/ci-publish.mjs
        env:
          NPM_PUBLISH_PROVENANCE: "true"
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./
          format: cyclonedx-json
          output-file: ./artifacts/sbom.cyclonedx.json

      - name: Upload publish flag
        if: success()
        run: |
          mkdir -p publish-flag
          echo "published" > publish-flag/flag.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: publish-flag
          path: publish-flag/flag.txt
          retention-days: 1

      - name: Upload release logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-logs-${{ github.run_id }}
          path: |
            /tmp/ci-publish-*.log
          retention-days: 7
          if-no-files-found: ignore
