name: Release

env:
  HUSKY: 0
  NPM_PUBLISH_PROVENANCE: "true"

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          # Do NOT set registry-url — it writes NODE_AUTH_TOKEN placeholder
          # into ~/.npmrc which breaks OIDC provenance when token is unset.

      - name: Pin npm version
        run: |
          sudo npm i -g npm@11.8.0
          npm -v

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build all packages
        run: pnpm build:ci

      - name: Check for unpublished packages
        id: check-publish
        run: |
          if ls .changeset/*.md >/dev/null 2>&1; then
            echo "changesets found — skip publish step"
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "no changesets — will publish"
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
          fi

      # Always create/update Version PR when changesets exist
      - name: Create Release PR
        if: steps.check-publish.outputs.has_changesets == 'true'
        uses: changesets/action@v1.5.3
        with:
          version: bash scripts/ci/changeset-version.sh
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Write clean .npmrc AFTER pnpm install (pnpm can overwrite ~/.npmrc).
      # Also written into repo root so npm resolves it from CWD before ~/.npmrc.
      # npm publish --provenance exchanges the OIDC token automatically —
      # no static auth token needed or wanted.
      - name: Configure npm for OIDC provenance
        if: steps.check-publish.outputs.has_changesets == 'false'
        run: |
          printf 'registry=https://registry.npmjs.org/\n' > ~/.npmrc
          printf 'registry=https://registry.npmjs.org/\n' > .npmrc
          echo "OIDC URL present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          echo "OIDC TOKEN present: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}"
          echo "~/.npmrc:"; cat ~/.npmrc
          echo ".npmrc:"; cat .npmrc

      - name: Publish to npm
        if: steps.check-publish.outputs.has_changesets == 'false'
        run: node scripts/ci/ci-publish.mjs
        env:
          NPM_PUBLISH_PROVENANCE: "true"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./
          format: cyclonedx-json
          output-file: ./artifacts/sbom.cyclonedx.json

      - name: Upload publish flag
        if: success()
        run: |
          mkdir -p publish-flag
          echo "published" > publish-flag/flag.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: publish-flag
          path: publish-flag/flag.txt
          retention-days: 1

      - name: Upload release logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-logs-${{ github.run_id }}
          path: |
            /tmp/ci-publish-*.log
          retention-days: 7
          if-no-files-found: ignore
