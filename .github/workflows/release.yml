name: Release

env:
  HUSKY: 0
  # Uses npm Trusted Publisher (OIDC) — no NPM_TOKEN secret needed.
  # --provenance causes npm to exchange the GitHub OIDC token for auth automatically.
  # Fallback: set NPM_TOKEN in GitHub secrets for non-OIDC auth.
  NPM_PUBLISH_PROVENANCE: "true"

# Trigger directly on push to main — simpler and more reliable than
# workflow_run which introduced a stale-SHA race condition: if a new commit
# landed between CI completing and the release job starting, changesets
# would operate on the wrong SHA.
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history is required for changesets to compute correct version bumps.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
          scope: '@ui-construction-library'

      # Pin npm to a specific version for reproducible publish behaviour.
      # npm@latest is not pinned and can introduce breaking changes mid-run.
      - name: Pin npm version
        run: |
          sudo npm i -g npm@11.8.0
          npm -v

      # If NPM_TOKEN secret is set, configure .npmrc for token-based auth
      - name: Configure npm auth
        if: secrets.NPM_TOKEN != ''
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" >> ~/.npmrc
          echo "registry=https://registry.npmjs.org/" >> ~/.npmrc

      # Release job always uses --no-frozen-lockfile:
      # changesets/action updates package.json versions BEFORE publish runs,
      # so the lockfile is intentionally out of date at that point in the flow.
      # Using --frozen-lockfile here would break the Version PR creation step.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build all packages
        run: pnpm build:ci

      - name: Tooling versions (diagnostics)
        run: |
          node -v && npm -v && pnpm -v
          echo "registry=$(npm config get registry)"

      - name: Create Release PR or Publish
        uses: changesets/action@v1.5.3
        with:
          # version: runs on every push — creates/updates the Version PR.
          # Calls changeset version then syncs apps/*/package.json so semver
          # refs to @ui-construction-library/* are kept up to date.
          version: bash scripts/ci/changeset-version.sh

          # publish: runs only when the Version PR is merged.
          # ci-publish.mjs rewrites workspace:* → real semver before each
          # `npm publish`, confirms the package appears on the registry,
          # then restores the original workspace refs.
          publish: node scripts/ci/ci-publish.mjs

          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Generate SBOM (CycloneDX format) for supply chain transparency
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./
          format: cyclonedx-json
          output-file: ./artifacts/sbom.cyclonedx.json

      # Upload a flag artifact so published-smoke.yml can be triggered.
      - name: Upload publish flag
        if: success()
        run: |
          mkdir -p publish-flag
          echo "published" > publish-flag/flag.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: publish-flag
          path: publish-flag/flag.txt
          retention-days: 1

      # Always upload full logs so failures are easy to diagnose.
      - name: Upload release logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-logs-${{ github.run_id }}
          path: |
            /tmp/ci-publish-*.log
          retention-days: 7
          if-no-files-found: ignore
