name: Demo Showcase Deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/demo-showcase/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/demo-showcase.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-demo-showcase
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # CI already validated on PR — build only
      - run: pnpm build --filter @ui-construction-library/tokens --filter @ui-construction-library/icons --filter @ui-construction-library/utils --filter @ui-construction-library/core
      - run: pnpm --filter @ui-app/demo-showcase build
        env:
          DEMO_BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./apps/demo-showcase/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
