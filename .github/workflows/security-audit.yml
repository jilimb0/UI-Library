name: Security Audit
on:
  schedule:
    - cron: '0 2 * * 1'
  push:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Security audit
        run: |
          pnpm audit --audit-level high
          pnpm audit --audit-level critical
