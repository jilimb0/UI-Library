
name: Bug Report
description: Report a bug or issue with the UI library
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please search existing issues before opening a new one.

  - type: input
    id: component
    attributes:
      label: Component
      description: Which component is affected?
      placeholder: "Button, Input, Modal etc."
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Describe the bug clearly and concisely
      placeholder: Describe what is happening.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
      placeholder: Describe expected behavior.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Details like OS, Browser and Versions
      placeholder: |
        - OS: macOS
        - Browser: Chrome
        - Library Version: 1.0.0
        - React Version: 18.0.0
    validations:
      required: true
