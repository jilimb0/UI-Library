name: Setup workspace

description: Checkout repository, install pnpm, setup Node.js with pnpm cache, and install dependencies.

inputs:
  node-version:
    description: Node.js version to use
    required: false
    default: '26'

runs:
  using: composite
  steps:
    - uses: actions/checkout@v6
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
    - name: Print Node/pnpm versions for cache diagnostics
      shell: bash
      run: |
        echo "node: $(node -v)"
        echo "pnpm: $(pnpm -v)"
    # Cannot use --frozen-lockfile: apps/solid-dashboard, svelte-dashboard,
    # vue-dashboard and builder use workspace:* deps which are never reflected
    # in pnpm-lock.yaml as real registry versions.
    - shell: bash
      run: pnpm install --no-frozen-lockfile
