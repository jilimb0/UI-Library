packages:
  - 'packages/*'
  - 'packages/integrations/*'
  - 'apps/*'
  - 'tools/*'

allowBuilds:
  esbuild: true
  sharp: true

# Migrated from the dead `pnpm.overrides` field in package.json (pnpm 11+ no
# longer reads it). Pins security patches for transitive deps pulled in by
# Storybook — see advisories GHSA-gv7w-rqvm-qjhr (esbuild), GHSA-96hv-2xvq-fx4p
# (ws) and GHSA-fx2h-pf6j-xcff (vite). React is forced to 18 because Storybook
# 10.4.4 and @testing-library/react both accept ^18 || ^19 — without this pin
# the tree resolves React 19, which splits the tree and breaks every
# React-rendering unit test (React.act / "older version of React" errors).
overrides:
  esbuild: '>=0.28.1'
  ws: '>=8.21.0'
  vite: '>=8.0.16'
  happy-dom: '>=20.8.9'
  postcss: '>=8.5.10'
  react: '18.3.1'
  react-dom: '18.3.1'
  '@types/react': '18.3.27'
  '@types/react-dom': '18.3.7'

packageExtensions:
  '@storybook/builder-vite@*':
    peerDependencies:
      vite: '^8.0.0'
  '@storybook/react-vite@*':
    peerDependencies:
      vite: '^8.0.0'
  'next@*':
    dependencies:
      postcss: '>=8.5.10'

catalog:
  '@biomejs/biome': '2.4.15'
  react: ^18.3.1
  react-dom: ^18.3.1
  typescript: ^5.9.3
  '@types/node': ^25.7.0
  '@types/react': ^18.3.27
  '@types/react-dom': ^18.3.7
  tailwindcss: ^4.3.0
  vite: ^8.0.0
  vitest: ^4.1.8
  rollup: ^4.34.8

patchedDependencies:
  next@16.2.6: patches/next@16.2.6.patch
